syntax = "proto3";

package greeter;

// A simple greeting service demonstrating unary and server-streaming RPCs.
service Greeter {
  // Unary RPC: send a name, receive one greeting.
  rpc SayHello (HelloRequest) returns (HelloReply) {}

  // Server-streaming RPC: send a name, receive a stream of greetings.
  rpc SayHelloStream (HelloRequest) returns (stream HelloReply) {}
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
}
